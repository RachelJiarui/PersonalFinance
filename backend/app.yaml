# Google Cloud App Engine configuration
runtime: python39

env_variables:
  FLASK_ENV: "production"
  PORT: "8080"

# Automatic scaling
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65

# Resources
resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10

# Handlers
handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
